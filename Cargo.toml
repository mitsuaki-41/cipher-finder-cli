[package]
name = "cipher-finder-cli"
version = "0.1.1"
edition = "2024"
description = "A command-line tool written in Rust for gematria cipher discovery, which searches for an alphabet cipher matching a list of user-provided target word-value pairs."
authors = [ "mitsuaki-41" ]
repository = "https://github.com/mitsuaki-41/cipher-finder-cli"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
rand = "0.8"
